<!doctype html>
<!--
  LISTLY — clickable design prototype (standalone, no build step)
  Full brief, behaviour rules, colours, fonts and open questions are in
  the companion file LISTLY-DESIGN.md. Data here is sample data held in
  memory; nothing persists between reloads.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE6">
<title>Listly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F5EFE6; --paper:#FFFCF7; --ink:#3B2F26; --muted:#7A6A5C; --soft:#5E4F43;
  --brown:#8A5E34; --brown-2:#7A5430; --sage:#6F8C5E; --sage-light:#A9BB9C; --sage-wash:#EDF2E6;
  --line:#E6DCCD; --line-2:#D9CBB8; --red:#B3362C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E1D5}
body{font-family:'Caveat',cursive;color:var(--ink);display:flex;justify-content:center}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.app{width:100%;max-width:430px;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--ground)}
header{display:flex;align-items:center;gap:12px;padding:18px 20px 10px;flex-shrink:0}
header img{width:46px;height:46px;border-radius:13px;object-fit:cover;box-shadow:0 1px 3px rgba(59,47,38,.15)}
.brand{font-size:36px;font-weight:700;line-height:1}
.today{font-size:18px;color:var(--muted)}
.alert{margin:4px 16px 6px;padding:14px 10px 14px 16px;background:var(--red);color:#fff;border-radius:16px;display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 4px 12px rgba(179,54,44,.28)}
.alert .t{font-size:26px;font-weight:700;line-height:1.05}
.alert .w{font-size:20px;opacity:.95}
.grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;flex-shrink:0;border:none;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent}
.alert .icon-btn{background:rgba(255,255,255,.18);color:#fff}
main{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px 16px 24px}
.stack{display:flex;flex-direction:column;gap:14px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.pagehead h1{margin:0;font-size:34px;color:var(--brown)}
.pagehead span{font-size:20px;color:var(--muted)}
.manage-btn{height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--line-2);background:var(--paper);color:var(--brown-2);font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.listhead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:60px;background:transparent;border:none;text-align:left}
.listhead .name{font-size:30px;font-weight:700;line-height:1.1}
.pill{font-size:20px;color:#5C7A4C;background:var(--sage-wash);padding:2px 12px;border-radius:999px;white-space:nowrap}
.defmark{color:var(--brown);display:flex}
.chev{transition:transform .2s;flex-shrink:0}
.open>.listhead .chev,.open>.donehead .chev{transform:rotate(90deg)}
.listbody{border-top:1.5px dashed var(--line);padding:6px 8px 12px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:2px;min-height:48px;border-radius:12px}
.row.over{background:var(--sage-wash)}
.grip{width:22px;display:flex;justify-content:center;cursor:grab;color:#C9B9A6;flex-shrink:0}
.tick{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;padding:0}
.box{width:26px;height:26px;border-radius:8px;border:2.4px solid var(--sage-light);display:flex;align-items:center;justify-content:center}
.box.on{background:var(--sage);border-color:var(--sage)}
.itemtext{flex:1;min-height:44px;text-align:left;background:transparent;border:none;font-size:26px;line-height:1.1;padding:4px 8px 4px 4px}
.itemtext.done{color:#8C7C6E;text-decoration:line-through}
.empty-note{font-size:21px;color:var(--muted);padding:8px 8px 0}
.addrow{display:flex;align-items:center;gap:8px;padding:8px 4px 4px 8px}
.line-input{flex:1;min-width:0;height:44px;border:none;border-bottom:2px solid var(--line-2);background:transparent;font-size:24px;padding:0 4px;outline:none}
.round-add{background:var(--sage);color:#fff}
.finish{display:flex;align-items:center;gap:10px;padding:12px 4px 0 8px}
.finish .hint{flex:1;font-size:19px;line-height:1.15;color:var(--muted)}
.btn{height:44px;padding:0 18px;border-radius:22px;border:none;font-size:22px;font-weight:700;flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
.btn.outline{border:2px solid var(--brown);background:var(--paper);color:var(--brown)}
.btn.brown{background:var(--brown);color:#fff}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{border:2px solid var(--line-2);background:transparent;color:var(--soft);font-weight:400}
.btn.danger{background:transparent;color:var(--red);padding:0 12px}
.newlist{display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px dashed var(--line-2);border-radius:18px}
.newlist input{flex:1;min-width:0;height:44px;border:none;background:transparent;font-size:26px;padding:0 4px;outline:none}
.empty{text-align:center;padding:24px 12px;font-size:24px;color:var(--muted)}
.jobform{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.jobform .line-input{width:100%;font-size:26px}
.due-lbl{display:flex;align-items:center;gap:8px;flex:1;font-size:20px;color:var(--muted)}
input[type=date]{flex:1;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--ground);font-size:18px;padding:0 8px}
.jobs{padding:6px 8px;display:flex;flex-direction:column}
.jobtext{flex:1;min-height:44px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:transparent;border:none;padding:4px 8px 4px 4px}
.jobtext .t{font-size:26px;line-height:1.1}
.chip{font-size:18px;padding:1px 10px;border-radius:999px;background:#F1E6D7;color:var(--brown-2)}
.chip.soon{background:#FBE6E3;color:#9E2A21}
.bell{color:#B5A594}
.bell[aria-pressed=true]{color:#fff;background:var(--sage)}
.done-card{background:#EFE7DB}
.donehead{width:100%;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px;background:transparent;border:none;color:var(--soft);text-align:left}
.donehead .name{font-size:26px;font-weight:700;flex:1}
.donetext{font-size:24px;color:#7E6E60;text-decoration:line-through;padding-left:4px}
nav{flex-shrink:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 12px calc(14px + env(safe-area-inset-bottom));background:var(--paper);border-top:1.5px solid var(--line)}
nav button{height:62px;border-radius:16px;border:none;background:transparent;color:var(--brown-2);font-size:21px;font-weight:700;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button[aria-current=page]{background:var(--brown);color:#fff}
.scrim{position:absolute;inset:0;background:rgba(59,47,38,.4);display:flex;flex-direction:column;justify-content:flex-end}
.scrim .close-area{flex:1;min-height:60px;background:transparent;border:none}
.sheet{background:var(--paper);border-radius:26px 26px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 24px rgba(59,47,38,.18);max-height:88%;overflow-y:auto}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line-2);align-self:center}
.sheet h2{margin:0;font-size:32px;color:var(--brown)}
.sheet .field{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--ground);font-size:28px;padding:0 12px}
.sheet .sub{font-size:20px;color:var(--muted)}
.sheet .lbl{font-size:22px;color:var(--soft);font-weight:700}
.sheet .help{font-size:20px;line-height:1.2;color:var(--muted);margin:-6px 0 0}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:24px;color:var(--ink)}
.check input{width:24px;height:24px;accent-color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line-2);background:var(--paper);font-size:22px}
.chips button[aria-pressed=true]{background:var(--sage);border-color:var(--sage);color:#fff}
.newname{width:100%;height:46px;border:2px dashed var(--line-2);border-radius:12px;background:transparent;font-size:24px;padding:0 12px}
.actions{display:flex;align-items:center;gap:10px;padding-top:4px}
.mrow{display:flex;align-items:center;gap:6px;min-height:52px;border-bottom:1.5px dashed var(--line)}
.mrow .nm{font-size:26px;font-weight:700;line-height:1.1}
.mrow .st{font-size:18px;color:var(--muted)}
.star{color:#C9B9A6}
.star[aria-pressed=true]{color:var(--brown)}
.del{color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  bell: sv(22, '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>'),
  star: sv(22, '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/>'),
  starFill: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
  starBig: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
  trash: sv(20, '<path d="M4.5 7h15"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 13h9l1-13"/>'),
  sliders: sv(18, '<path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/>')
};
const JOB_PAGES = { house: { title: 'House jobs', short: 'House job' }, mine: { title: 'My jobs', short: 'My job' } };

// ---------- date helpers ----------
const today = () => { const t = new Date(); t.setHours(0,0,0,0); return t; };
const pad = n => (n < 10 ? '0' : '') + n;
const ymd = t => t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
const addDays = n => { const t = today(); t.setDate(t.getDate()+n); return ymd(t); };
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const daysTo = s => Math.round((parse(s) - today()) / 86400000);
const pretty = t => t.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
function dueLabel(s){
  const n = daysTo(s);
  if (n < -1) return 'Overdue by ' + (-n) + ' days';
  if (n === -1) return 'Overdue since yesterday';
  if (n === 0) return 'Due today';
  if (n === 1) return 'Due tomorrow';
  if (n <= 3) return 'Due in ' + n + ' days · ' + pretty(parse(s));
  return 'Due ' + pretty(parse(s));
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seq = 0; const uid = () => 'n' + Date.now().toString(36) + (++seq);

// ---------- sample state ----------
// List rules: isDefault lists always show (even empty). Non-default lists are
// hidden while empty — except a list you have just created ("fresh"), which
// stays visible until it has had items.
const S = {
  tab: 'shopping',
  lists: [
    { id:'l1', name:'Tesco', isDefault:true, open:true, items:[
      {id:'i1',text:'Semi-skimmed milk',done:true},{id:'i2',text:'Sourdough loaf',done:false},
      {id:'i3',text:'Bananas',done:false},{id:'i4',text:'Chicken thighs',done:true},
      {id:'i5',text:'Washing-up liquid',done:false},{id:'i6',text:'Mature cheddar',done:false}]},
    { id:'l2', name:'M&S', isDefault:true, open:false, items:[
      {id:'i7',text:'Salmon fillets',done:false},{id:'i8',text:'Flowers',done:false}]},
    { id:'l3', name:'Pets at Home', isDefault:true, open:false, items:[] },
    { id:'l4', name:'Costco', isDefault:true, open:false, items:[
      {id:'i12',text:'Kitchen roll',done:false},{id:'i13',text:'Coffee beans',done:false},{id:'i14',text:'Olive oil',done:false}]},
    { id:'l5', name:'B&Q', isDefault:false, open:false, items:[
      {id:'i15',text:'Fence paint',done:false},{id:'i16',text:'Hinges for gate',done:false}]},
    { id:'l6', name:'Boots', isDefault:false, open:false, items:[] }
  ],
  jobs: [
    {id:'j1',page:'house',text:'Renew car insurance',due:addDays(1),remind:true,done:false},
    {id:'j2',page:'house',text:'Book boiler service',due:addDays(3),remind:false,done:false},
    {id:'j3',page:'house',text:'Fix the garden gate',due:addDays(20),remind:false,done:false},
    {id:'j4',page:'house',text:'Clear the gutters',due:'',remind:false,done:false},
    {id:'j5',page:'house',text:'Change smoke alarm batteries',due:'',remind:false,done:true},
    {id:'j6',page:'mine',text:'Renew gym membership',due:addDays(2),remind:true,done:false},
    {id:'j7',page:'mine',text:'Renew passport',due:addDays(40),remind:false,done:false},
    {id:'j8',page:'mine',text:'Sort out pension paperwork',due:'',remind:false,done:false}
  ],
  doneOpen:{ house:false, mine:false }, dismissed:{}, sheet:null, drag:null
};
const findList = id => S.lists.find(l => l.id === id);
const isVisible = l => l.isDefault || l.items.length > 0 || l.fresh;

// ---------- render ----------
const app = document.getElementById('app');
function render(){
  const focus = document.activeElement && document.activeElement.dataset.keep;
  const alerts = S.jobs.filter(j => !j.done && j.due && !S.dismissed[j.id] && daysTo(j.due) <= 3)
    .sort((a,b) => a.due < b.due ? -1 : 1);
  let h = `<header><img src="${LOGO}" alt="Listly logo"><div><div class="brand">Listly</div>
    <div class="today">${today().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div></div></header>`;
  h += alerts.map(j => `<div class="alert" role="alert">${I.warn}<div class="grow"><div class="t">${esc(j.text)}</div>
    <div class="w">${JOB_PAGES[j.page].short} · ${dueLabel(j.due)}</div></div>
    <button class="icon-btn" data-a="dismiss" data-id="${j.id}" aria-label="Dismiss reminder">${I.x}</button></div>`).join('');
  h += '<main>' + (S.tab === 'shopping' ? shopHTML() : jobsHTML(S.tab)) + '</main>';
  const tab = (id, icon, label) => `<button data-a="tab" data-tab="${id}" aria-current="${S.tab===id?'page':'false'}">${icon}${label}</button>`;
  h += `<nav>${tab('shopping', I.basket, 'Shopping')}${tab('house', I.house, 'House jobs')}${tab('mine', I.me, 'My jobs')}</nav>`;
  if (S.sheet) h += S.sheet.kind === 'manage' ? manageHTML() : sheetHTML();
  const oldMain = app.querySelector('main'), scroll = oldMain ? oldMain.scrollTop : 0;
  app.innerHTML = h;
  app.querySelector('main').scrollTop = scroll;
  if (focus) { const el = app.querySelector(`[data-keep="${focus}"]`); if (el) el.focus(); }
}
function shopHTML(){
  const shown = S.lists.filter(isVisible);
  let h = `<div class="stack"><div class="pagehead"><h1>Shopping</h1>
    <button class="manage-btn" data-a="openManage">${I.sliders}Manage lists</button></div>`;
  for (const l of shown){
    const left = l.items.filter(i => !i.done).length, got = l.items.length - left;
    const count = !l.items.length ? 'empty' : (left ? left + ' to get' : 'all got');
    h += `<section class="card ${l.open?'open':''}"><button class="listhead" data-a="toggleList" data-id="${l.id}" aria-expanded="${l.open}">
      <span style="color:var(--brown)">${I.chev}</span><span class="name">${esc(l.name)}</span>
      ${l.isDefault?`<span class="defmark" title="Default list">${I.starFill}<span class="sr">Default list</span></span>`:''}
      <span class="grow"></span><span class="pill">${count}</span></button>`;
    if (l.open){
      h += '<div class="listbody">';
      if (!l.items.length) h += `<div class="empty-note">Nothing on this list yet.</div>`;
      for (const it of l.items){
        h += `<div class="row" draggable="true" data-list="${l.id}" data-item="${it.id}">
          <span class="grip" title="Drag to reorder">${I.grip}</span>
          <button class="tick" data-a="toggleItem" data-list="${l.id}" data-id="${it.id}" aria-pressed="${it.done}" aria-label="Tick off ${esc(it.text)}"><span class="box ${it.done?'on':''}">${it.done?I.tick:''}</span></button>
          <button class="itemtext ${it.done?'done':''}" data-a="editItem" data-list="${l.id}" data-id="${it.id}">${esc(it.text)}</button></div>`;
      }
      h += `<div class="addrow"><input class="line-input" data-keep="add-${l.id}" data-enter="addItem" data-list="${l.id}" placeholder="Add an item…" aria-label="Add an item to ${esc(l.name)}">
        <button class="icon-btn round-add" data-a="addItem" data-list="${l.id}" aria-label="Add item">${I.plus}</button></div>`;
      if (l.items.length){
        let hint;
        if (left) hint = !got ? 'Nothing ticked yet — all ' + left + ' stay for next time.' : left + ' unticked will stay for next time.';
        else hint = l.isDefault ? 'Everything’s ticked — list will be emptied (it’s a default, so it stays).' : 'Everything’s ticked — list will be emptied and hidden.';
        h += `<div class="finish"><div class="hint">${hint}</div><button class="btn outline" data-a="finish" data-id="${l.id}">${I.tickSm}Finish shop</button></div>`;
      }
      h += '</div>';
    }
    h += '</section>';
  }
  if (!shown.length) h += '<div class="empty">No lists yet — start one below.</div>';
  h += `<div class="newlist"><input data-keep="newlist" data-enter="addList" placeholder="New list, e.g. Tesco" aria-label="New list name">
    <button class="btn brown" data-a="addList">Add list</button></div></div>`;
  return h;
}
function jobsHTML(page){
  const mine = S.jobs.filter(j => j.page === page);
  const open = mine.filter(j => !j.done).sort((a,b) => a.due && b.due ? (a.due < b.due ? -1 : 1) : (a.due ? -1 : (b.due ? 1 : 0)));
  const done = mine.filter(j => j.done);
  let h = `<div class="stack"><div class="pagehead"><h1>${JOB_PAGES[page].title}</h1><span>${open.length} to do</span></div>
    <div class="card jobform"><input class="line-input" data-keep="newjob-${page}" data-enter="addJob" data-page="${page}" placeholder="Add a job…" aria-label="New job">
    <div style="display:flex;align-items:center;gap:8px"><label class="due-lbl">Due <input type="date" data-keep="newdue-${page}"></label>
    <button class="btn sage" data-a="addJob" data-page="${page}">Add</button></div></div><div class="card jobs">`;
  for (const j of open){
    const soon = j.due && daysTo(j.due) <= 3;
    h += `<div class="row" style="min-height:52px"><button class="tick" data-a="toggleJob" data-id="${j.id}" aria-pressed="false" aria-label="Mark ${esc(j.text)} done"><span class="box"></span></button>
      <button class="jobtext" data-a="editJob" data-id="${j.id}"><span class="t">${esc(j.text)}</span>${j.due?`<span class="chip ${soon?'soon':''}">${dueLabel(j.due)}</span>`:''}</button>
      ${j.due?`<button class="icon-btn bell" data-a="toggleRemind" data-id="${j.id}" aria-pressed="${!!j.remind}" aria-label="Remind me about ${esc(j.text)}" title="${j.remind?'Reminder on':'Set a reminder'}">${I.bell}</button>`:''}</div>`;
  }
  if (!open.length) h += '<div class="empty">All jobs done. Nice.</div>';
  const dOpen = S.doneOpen[page];
  h += `</div><div class="card done-card ${dOpen?'open':''}"><button class="donehead" data-a="toggleDone" data-page="${page}" aria-expanded="${dOpen}">${I.chev}<span class="name">Done</span><span style="font-size:20px">${done.length}</span></button>`;
  if (dOpen){
    h += '<div style="padding:0 8px 10px">' + done.map(j => `<div class="row" style="min-height:46px"><button class="tick" data-a="toggleJob" data-id="${j.id}" aria-pressed="true" aria-label="Move ${esc(j.text)} back"><span class="box on">${I.tick}</span></button><span class="donetext">${esc(j.text)}</span></div>`).join('') + '</div>';
  }
  return h + '</div></div>';
}
function sheetHTML(){
  const sh = S.sheet, isJob = sh.kind === 'job';
  let h = `<div class="scrim"><button class="close-area" data-a="closeSheet" aria-label="Close"></button>
    <div class="sheet" role="dialog" aria-label="${isJob?'Edit job':'Edit item'}"><div class="handle"></div>
    <div class="pagehead" style="padding:0"><h2>${isJob?'Edit job':'Edit item'}</h2><span class="sub">${isJob?JOB_PAGES[sh.page].title:'in '+esc(findList(sh.listId).name)}</span></div>
    <input class="field" data-keep="sheettext" data-bind="text" value="${esc(sh.text)}" aria-label="Name">`;
  if (isJob){
    h += `<label class="lbl" style="display:flex;align-items:center;gap:10px">Due date <input type="date" data-bind="due" value="${sh.due}"></label>`;
    if (sh.due) h += `<label class="check"><input type="checkbox" data-bind="remind" ${sh.remind?'checked':''}>Remind me about this job</label>`;
  } else {
    h += `<div class="lbl">Move to another list</div><div class="chips">` +
      S.lists.filter(l => l.id !== sh.listId).map(l => `<button data-a="pickMove" data-id="${l.id}" aria-pressed="${sh.moveTo===l.id}">${esc(l.name)}</button>`).join('') +
      `</div><input class="newname" data-keep="newname" data-bind="newName" value="${esc(sh.newName)}" placeholder="…or name a new list" aria-label="Move to a new list">`;
  }
  return h + `<div class="actions"><button class="btn danger" data-a="deleteSheet">Delete</button><div style="flex:1"></div>
    <button class="btn ghost" data-a="closeSheet">Cancel</button><button class="btn sage" data-a="saveSheet">Save</button></div></div></div>`;
}
function manageHTML(){
  let h = `<div class="scrim"><button class="close-area" data-a="closeSheet" aria-label="Close"></button>
    <div class="sheet" role="dialog" aria-label="Manage lists"><div class="handle"></div>
    <h2>Manage lists</h2>
    <p class="help">Star a shop to make it a default list — it always shows, even when empty. Other lists hide themselves when empty.</p><div>`;
  for (const l of S.lists){
    const st = l.items.length ? l.items.length + (l.items.length === 1 ? ' item' : ' items') : (l.isDefault ? 'empty · always shown' : 'empty · hidden');
    h += `<div class="mrow"><button class="icon-btn star" data-a="toggleDefault" data-id="${l.id}" aria-pressed="${l.isDefault}" aria-label="Default list: ${esc(l.name)}">${l.isDefault?I.starBig:I.star}</button>
      <div class="grow"><div class="nm">${esc(l.name)}</div><div class="st">${st}</div></div>
      <button class="icon-btn del" data-a="deleteList" data-id="${l.id}" aria-label="Delete ${esc(l.name)} list">${I.trash}</button></div>`;
  }
  return h + `</div><div class="newlist"><input data-keep="newdefault" data-enter="addDefault" placeholder="Add a default list" aria-label="Add a default list">
    <button class="btn brown" data-a="addDefault">Add</button></div>
    <div class="actions"><div style="flex:1"></div><button class="btn sage" data-a="closeSheet">Done</button></div></div></div>`;
}

// ---------- actions ----------
const val = sel => { const el = app.querySelector(sel); return el ? el.value : ''; };
const A = {
  tab: el => { S.tab = el.dataset.tab; },
  dismiss: el => { S.dismissed[el.dataset.id] = true; },
  toggleList: el => { const l = findList(el.dataset.id); l.open = !l.open; },
  toggleItem: el => { const it = findList(el.dataset.list).items.find(i => i.id === el.dataset.id); it.done = !it.done; },
  editItem: el => { const it = findList(el.dataset.list).items.find(i => i.id === el.dataset.id);
    S.sheet = { kind:'item', listId:el.dataset.list, itemId:it.id, text:it.text, moveTo:'', newName:'' }; },
  addItem: el => { const t = val(`[data-keep="add-${el.dataset.list}"]`).trim();
    if (t) { const l = findList(el.dataset.list); l.items.push({ id:uid(), text:t, done:false }); delete l.fresh; } },
  finish: el => { const l = findList(el.dataset.id); l.items = l.items.filter(i => !i.done); l.open = false; },
  addList: () => { const t = val('[data-keep="newlist"]').trim();
    if (t) S.lists.push({ id:uid(), name:t, isDefault:false, fresh:true, open:true, items:[] }); },
  openManage: () => { S.sheet = { kind:'manage' }; },
  toggleDefault: el => { const l = findList(el.dataset.id); l.isDefault = !l.isDefault; },
  deleteList: el => { const l = findList(el.dataset.id);
    if (!l.items.length || confirm('Delete "' + l.name + '" and its ' + l.items.length + ' item(s)?')) S.lists = S.lists.filter(x => x !== l); },
  addDefault: () => { const t = val('[data-keep="newdefault"]').trim();
    if (t) S.lists.push({ id:uid(), name:t, isDefault:true, open:false, items:[] }); },
  addJob: el => { const p = el.dataset.page, t = val(`[data-keep="newjob-${p}"]`).trim(), d = val(`[data-keep="newdue-${p}"]`);
    if (t) S.jobs.push({ id:uid(), page:p, text:t, due:d, remind:false, done:false }); },
  toggleJob: el => { const j = S.jobs.find(x => x.id === el.dataset.id); j.done = !j.done; },
  toggleRemind: el => { const j = S.jobs.find(x => x.id === el.dataset.id); j.remind = !j.remind; },
  editJob: el => { const j = S.jobs.find(x => x.id === el.dataset.id); S.sheet = { kind:'job', jobId:j.id, page:j.page, text:j.text, due:j.due, remind:!!j.remind }; },
  toggleDone: el => { const p = el.dataset.page; S.doneOpen[p] = !S.doneOpen[p]; },
  pickMove: el => { S.sheet.moveTo = S.sheet.moveTo === el.dataset.id ? '' : el.dataset.id; S.sheet.newName = ''; },
  closeSheet: () => { S.sheet = null; },
  deleteSheet: () => { const sh = S.sheet;
    if (sh.kind === 'job') S.jobs = S.jobs.filter(j => j.id !== sh.jobId);
    else { const l = findList(sh.listId); l.items = l.items.filter(i => i.id !== sh.itemId); }
    S.sheet = null; },
  saveSheet: () => { const sh = S.sheet;
    if (sh.kind === 'job'){ const j = S.jobs.find(x => x.id === sh.jobId);
      j.text = sh.text.trim() || j.text; j.due = sh.due; j.remind = !!(sh.due && sh.remind); delete S.dismissed[j.id]; }
    else {
      const src = findList(sh.listId), idx = src.items.findIndex(i => i.id === sh.itemId), it = src.items[idx];
      it.text = sh.text.trim() || it.text;
      let target = sh.moveTo ? findList(sh.moveTo) : null;
      if (!target && sh.newName.trim()){ target = { id:uid(), name:sh.newName.trim(), isDefault:false, open:true, items:[] }; S.lists.push(target); }
      if (target && target !== src){ src.items.splice(idx, 1); target.items.push(it); target.open = true; delete target.fresh; }
    }
    S.sheet = null; }
};
app.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; A[el.dataset.a](el); render(); });
app.addEventListener('keydown', e => { const el = e.target; if (e.key === 'Enter' && el.dataset.enter){ A[el.dataset.enter](el); render(); } });
app.addEventListener('input', e => { const b = e.target.dataset.bind; if (!b || !S.sheet) return;
  if (b === 'remind') { S.sheet.remind = e.target.checked; return; }
  S.sheet[b] = e.target.value;
  if (b === 'newName'){ S.sheet.moveTo = ''; app.querySelectorAll('.chips [aria-pressed]').forEach(c => c.setAttribute('aria-pressed','false')); } });
app.addEventListener('change', e => { if (e.target.dataset.bind === 'due') render(); }); // show/hide reminder option

// drag to reorder within a list (desktop HTML5 DnD — real build needs touch support)
app.addEventListener('dragstart', e => { const r = e.target.closest('.row[data-item]'); if (!r) return;
  S.drag = { list:r.dataset.list, item:r.dataset.item }; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', r.dataset.item); });
app.addEventListener('dragover', e => { const r = e.target.closest('.row[data-item]'); if (!r || !S.drag || r.dataset.list !== S.drag.list) return;
  e.preventDefault(); app.querySelectorAll('.row.over').forEach(x => x.classList.remove('over')); if (r.dataset.item !== S.drag.item) r.classList.add('over'); });
app.addEventListener('drop', e => { const r = e.target.closest('.row[data-item]'); if (!r || !S.drag || r.dataset.list !== S.drag.list) return;
  e.preventDefault(); const l = findList(S.drag.list), from = l.items.findIndex(i => i.id === S.drag.item);
  const moved = l.items.splice(from, 1)[0], to = l.items.findIndex(i => i.id === r.dataset.item);
  l.items.splice(to < 0 ? l.items.length : (from <= to ? to + 1 : to), 0, moved); S.drag = null; render(); });
app.addEventListener('dragend', () => { S.drag = null; app.querySelectorAll('.row.over').forEach(x => x.classList.remove('over')); });

render();
</script>
</body>
</html>
