    <meta name="theme-color" content="#F5EFE6" />

    <title>Listly</title>
    <script>
      // ── Real viewport height + safe-area fix ────────────────────────────
      // Ported verbatim in shape from shared-finance-ledger/index.html, which
      // paid for it on real hardware. iOS WKWebView (standalone "Add to Home
      // Screen" mode — which is exactly how Listly is meant to be used, since
      // Web Push does not work in a Safari tab at all) has a known bug where
      // 100dvh is sometimes computed against a stale viewport on first paint,
      // leaving dead space at the bottom until the user scrolls. Likewise
      // `env(safe-area-inset-*)` read live through a CSS custom property can
      // return a stale value, showing up as missing top safe-area padding.
      //
      // Fix: measure the real values in JS (visualViewport for height, a DOM
      // probe for the insets — an element with `height: env(safe-area-inset-*)`
      // set directly, not through a variable) and write resolved pixels onto
      // --app-height / --safe-top / --safe-bottom, re-measuring on every event
      // that could change them.
      (function () {
        function measureEnv(prop) {
          var el = document.createElement('div')
          el.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(' + prop + ', 0px);visibility:hidden;pointer-events:none;'
          document.documentElement.appendChild(el)
          var val = el.offsetHeight
          document.documentElement.removeChild(el)
          return val
        }

        // In iOS standalone mode window.innerHeight shrinks WITH the keyboard,
        // making innerHeight - visualViewport.height ~ 0 — useless for
        // detection. window.screen.height is the physical screen height and
        // never changes, so comparing against 75% of it reliably distinguishes
        // "keyboard open" from any legitimate resize. Listly needs this more
        // than the ledger does: every list has an "Add an item…" field, so the
        // keyboard is open for most of a shop.
        function isKeyboardOpen() {
          if (!window.visualViewport) return false
          if (!window.navigator.standalone) return false
          var vvh = window.visualViewport.height
          var screenH = (window.screen && window.screen.height) || vvh * 2
          return vvh < screenH * 0.75
        }

        function setAppHeight() {
          if (isKeyboardOpen()) return
          var measured = (window.visualViewport && window.visualViewport.height) || window.innerHeight
          var h = measured + measureEnv('safe-area-inset-top')
          if (window.screen && window.screen.height) h = Math.min(h, window.screen.height)
          document.documentElement.style.setProperty('--app-height', h + 'px')
        }

        function setSafeAreaVars() {
          document.documentElement.style.setProperty('--safe-bottom', measureEnv('safe-area-inset-bottom') + 'px')
          document.documentElement.style.setProperty('--safe-top', measureEnv('safe-area-inset-top') + 'px')
        }

        // 🚨 The floating nav's bottom, set from the DOM PROBE rather than
        // from the CSS env() value. Ported from BLOC's positionNavDirect()
        // for the same reason the probe exists at all: the CSS value can be
        // stale on iOS standalone, and the nav is the one element where a
        // stale inset is immediately visible — it either collides with the
        // home indicator or floats away from it. -6px deliberately tucks the
        // pill into that strip, exactly as BLOC does.
        //
        // The CSS rule already says `bottom: calc(var(--safe-bottom) - 6px)`,
        // so this is belt and braces: it wins when they disagree, and it is
        // harmless when they do not.
        function positionNavDirect() {
          var nav = document.querySelector('.app > nav')
          if (!nav) return
          // Same floor as the CSS rule: the -6px tuck only makes sense when
          // there is a home-indicator strip to tuck into.
          nav.style.bottom = Math.max(measureEnv('safe-area-inset-bottom') - 6, 8) + 'px'
        }

        function measureAll() {
          setAppHeight()
          setSafeAreaVars()
          positionNavDirect()
        }

        document.addEventListener('DOMContentLoaded', function () {
          var n = 0
          var iv = setInterval(function () {
            measureAll()
            if (++n > 10) clearInterval(iv)
          }, 500)
        })
        measureAll()
        requestAnimationFrame(function () {
          requestAnimationFrame(measureAll)
        })
        setTimeout(measureAll, 100)
        setTimeout(measureAll, 400)
        window.addEventListener('resize', measureAll)
        window.addEventListener('orientationchange', measureAll)
        window.addEventListener('pageshow', measureAll)
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', measureAll)
        }
      })()
    </script>
